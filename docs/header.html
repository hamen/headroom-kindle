<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1280px;height:640px;overflow:hidden;background:radial-gradient(1200px 700px at 85% 30%,#1b2a4a 0%,#0d1117 55%,#090c10 100%);font-family:'JetBrainsMono NF','Fira Code',monospace;color:#e6edf3;position:relative}
.grid{position:absolute;inset:0;background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:40px 40px}
.left{position:absolute;left:72px;top:150px;width:530px}
h1{font-size:58px;font-weight:800;letter-spacing:-3px;line-height:1;white-space:nowrap}
h1 span{color:#f0883e}
.tag{margin-top:26px;font-size:25px;color:#9da7b3;line-height:1.45}
.stat{margin-top:44px;display:flex;align-items:baseline;gap:18px;font-size:40px;font-weight:700}
.old{color:#6e7681;text-decoration:line-through;text-decoration-thickness:3px}
.arrow{color:#6e7681;font-size:34px}
.new{color:#3fb950}
.note{margin-top:10px;font-size:18px;color:#6e7681;white-space:nowrap}
.kindle{position:absolute;right:64px;top:104px;width:590px;height:416px;border-radius:22px;background:linear-gradient(160deg,#26292e,#15171a);box-shadow:0 40px 80px #0009,inset 0 0 0 1px #ffffff14}
.screen{position:absolute;left:26px;top:26px;width:496px;height:367px;border-radius:3px;overflow:hidden;background:#e9e7df;box-shadow:inset 0 0 0 2px #0006}
.screen img{width:100%;height:100%;display:block;mix-blend-mode:multiply;filter:contrast(.92)}
.logo{position:absolute;right:16px;top:50%;transform:translateY(-50%) rotate(-90deg);font-family:Arial,Helvetica,sans-serif;font-size:19px;color:#c9cdd3;letter-spacing:.5px}
.cap{position:absolute;right:64px;top:548px;width:590px;white-space:nowrap;text-align:center;font-size:17px;color:#6e7681}
</style></head><body><div class="grid"></div>
<div class="left"><h1>headroom<span>-kindle</span></h1>
<div class="tag">Your AI quota, on a<br>2012 Kindle Paperwhite.</div>
<div class="stat"><span class="old">e-reader</span><span class="arrow">→</span><span class="new">dashboard</span></div>
<div class="note">jailbroken · powered over USB · e-ink</div></div>
<div class="kindle"><div class="screen"><img src="header-dashboard.png" alt=""></div><div class="logo">kindle</div></div>
<div class="cap">Claude · Codex · Z.AI · Grok · redrawn every 10 min</div>
</body></html>
